[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "egressdiff"
version = "0.0.0"
description = "Local release-to-release egress diff for Docker Compose"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
egressdiff = "egressdiff.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/egressdiff"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
